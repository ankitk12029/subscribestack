version: 2

sources:
  - name: raw
    schema: main
    tables:
      - name: raw_users
        description: "Synthetic user signup records."
      - name: raw_subscription_events
        description: >
          Synthetic subscription lifecycle events: trial starts, trial
          cancels, trial conversions, renewals, churn, refunds, and
          chargebacks. One row per event, not per user -- a single user
          can appear many times across their lifecycle.
