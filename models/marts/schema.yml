version: 2

models:
  - name: fct_trials
    description: >
      One row per trial that was ever started. THE authoritative source for
      any question about trial volume or trial-to-paid conversion.

      Metric definitions and known gotchas:
        - `is_countable_trial`: use this, not a raw row count, when anyone
          asks "how many trials did we start." It excludes trials cancelled
          the same day they began (accidental starts / instant cancels),
          which is what "trial start" means in every business review this
          data has ever been used for. About 12% of raw trial_start events
          fail this filter.
        - `converted`: true only if the trial has a linked trial_convert
          event. A trial that is still within its trial window (neither
          converted nor cancelled yet) will show converted = false; don't
          read that as "this trial failed" without also checking whether
          the trial window has actually closed.
        - `days_to_convert`: null for trials that never converted.
    columns:
      - name: trial_transaction_id
        description: "Primary key: the original trial_start transaction."
        tests: [unique, not_null]
      - name: user_id
        tests: [not_null]
      - name: is_same_day_cancel
        description: "True if the trial was cancelled the same calendar day it started."
      - name: is_countable_trial
        description: >
          The metric to use for "trial starts." False for same-day cancels.
          Always filter on this column rather than counting raw rows.
      - name: converted
        description: "True if this trial has a matching trial_convert event."

  - name: fct_revenue_daily
    description: >
      Daily revenue, split by store and product, in two flavors that answer
      two different questions:

        - `tracked_revenue`: what we recognized at the moment of each charge
          (trial_convert / renewal), BEFORE we know if it will be refunded.
          This is the number that matches what you'd see in a "gross sales"
          or "bookings" report on the day of the transaction.
        - `realized_revenue`: tracked_revenue, net of any refund or
          chargeback that references it, AND net of the store's fee
          (15% for App Store / Play Store, 2.9% for Stripe). This is the
          number that matches what actually lands as usable revenue.

      Critically: a refund that happens on March 20th for a charge that
      happened on March 1st is netted back into MARCH 1ST's realized_revenue
      here, not March 20th's. If you sum realized_revenue by the refund's
      own date instead, you will see revenue swings on days where nothing
      was actually sold -- that's the "why did revenue drop with no sales"
      question this table exists to prevent.
    columns:
      - name: date
        tests: [not_null]
      - name: tracked_revenue
        description: "Gross revenue recognized at transaction time, before refunds/fees."
      - name: realized_revenue
        description: "Net revenue after refunds, chargebacks, and store fees, attributed to the ORIGINAL transaction date."

  - name: fct_conversion_funnel
    description: >
      Monthly trial -> paid conversion funnel by acquisition channel and
      country. Built on top of fct_trials' `is_countable_trial` filter, so
      conversion_rate_pct is never inflated or deflated by same-day-cancel
      noise -- you do not need to remember to add that filter yourself.
    columns:
      - name: countable_trials
        description: "Trials excluding same-day cancels. See fct_trials.is_countable_trial."
      - name: conversion_rate_pct
        description: "conversions / countable_trials * 100, rounded to 2 decimals."
